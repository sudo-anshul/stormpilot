name: Verify StormPilot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 engine/build.py
      - run: npm test
      - name: Verify recorded demonstration against included sources
        run: |
          python3 -c "import gzip,pathlib; pathlib.Path('runtime').mkdir(exist_ok=True); pathlib.Path('runtime/demo.json').write_bytes(gzip.decompress(pathlib.Path('fixtures/demo-packet.json.gz').read_bytes()))"
          python3 -m validation.validate_packet runtime/demo.json --root . --output runtime/demo-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-check
          path: runtime/demo-check.json
          if-no-files-found: ignore
